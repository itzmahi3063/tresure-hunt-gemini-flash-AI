<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Treasure Hunt - Telegram Mini App</title>
    <!-- Google Fonts for Web3 Gaming UI: Russo One, Outfit, Chakra Petch, Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Russo+One&display=swap" rel="stylesheet">
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <!-- Adexium Widget SDK for Telegram Mini Apps -->
    <link rel="stylesheet" href="https://cdn.tgads.space/assets/css/style.min.css">
    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
    <script type="text/javascript">
      // Safe Adexium initialization
      (function() {
        function initAdexium() {
          try {
            if (typeof AdexiumWidget === 'undefined') return;
            // Shim WebView if needed for Telegram platforms
            if (window.Telegram && window.Telegram.WebApp && !window.Telegram.WebView) {
              window.Telegram.WebView = {
                initParams: {
                  tgWebAppPlatform: window.Telegram.WebApp.platform || 'android'
                }
              };
            }
            // Seed userData in localStorage for Adexium internal lookup
            var tgUser = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
            if (tgUser && tgUser.id) {
              try {
                localStorage.setItem('tg-ads-co-userData', JSON.stringify({
                  id: tgUser.id,
                  firstName: tgUser.first_name || '',
                  lastName: tgUser.last_name || '',
                  username: tgUser.username || '',
                  language: tgUser.language_code || 'en',
                  platform: (window.Telegram.WebApp && window.Telegram.WebApp.platform) || 'android',
                  initData: (window.Telegram.WebApp && window.Telegram.WebApp.initData) || ''
                }));
              } catch (e) {}
            }
            if (!window.adexiumWidget) {
              window.adexiumWidget = new AdexiumWidget({
                wid: '3244f7f7-db89-4f7a-8342-092d462aa3f8',
                adFormat: 'interstitial',
                debug: !(tgUser && tgUser.id)
              });
              console.log('[Adexium] Widget ready on window.adexiumWidget');
            }
          } catch (err) {
            console.warn('[Adexium] Init fallback:', err);
            try {
              window.adexiumWidget = new AdexiumWidget({
                wid: '3244f7f7-db89-4f7a-8342-092d462aa3f8',
                adFormat: 'interstitial',
                debug: true
              });
            } catch (e) {}
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initAdexium);
        } else {
          initAdexium();
        }
      })();
    </script>
    <!-- Monetag SDK (zone 11828835) — used for the Daily "Watch & Earn" Monetag slot and the Daily Rewards popup ad -->
    <script async src='//libtl.com/sdk.js' data-zone='11828835' data-sdk='show_11828835'></script>
    <!-- Adsgram SDK — used for the two "Adsgram" Daily Watch & Earn slots (real block IDs are set per-slot in the admin panel) -->
    <script async src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <!-- USL TowerAds SDK — used for the USL Watch & Earn slot -->
    <script async src="https://uslads.com/sdk/tower-ads-v4.js"></script>
    <!-- Gigapub SDK — used in the Daily Monetag flow (first 5 ads of each day) -->
    <script async src="https://ad.gigapub.tech/script?id=8273"></script>
  </head>
  <body class="bg-[#0A0A0E] text-white selection:bg-yellow-500 selection:text-black overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
