<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="greenDisk" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9bef2e"/>
      <stop offset="40%" stop-color="#72cf13"/>
      <stop offset="85%" stop-color="#4f9a0b"/>
      <stop offset="100%" stop-color="#3c7a06"/>
    </radialGradient>
    <radialGradient id="bevelGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c4ff66" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#84e015" stop-opacity="0"/>
    </radialGradient>
    <filter id="diskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2a5503" flood-opacity="0.45"/>
    </filter>
    <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#2a5503" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rim / Bevel -->
  <circle cx="50" cy="50" r="47" fill="url(#greenDisk)" filter="url(#diskShadow)"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#b4fb43" stroke-width="2.5" opacity="0.75"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#3c7a06" stroke-width="1.5" opacity="0.35"/>
  <circle cx="50" cy="50" r="40" fill="url(#bevelGlow)"/>

  <!-- Inner Recessed Disk -->
  <circle cx="50" cy="50" r="38" fill="url(#greenDisk)"/>
  
  <!-- Pointing Finger Hand (1st / #1 Icon) -->
  <g filter="url(#handShadow)" fill="#ffffff">
    <!-- Pointing Index Finger -->
    <rect x="44.5" y="22" width="11" height="28" rx="5.5"/>
    <!-- Folded Fingers (Middle, Ring, Pinky) -->
    <path d="M 44.5 44 C 44.5 40 40 40 37 43 C 34 46 34 52 34 56 C 34 65 40 73 50 75 C 60 75 66 67 66 58 C 66 52 64 47 57 47 C 55.5 47 55.5 44 44.5 44 Z"/>
    <!-- Thumb resting over knuckles -->
    <path d="M 36 50 C 36 45 43 45 45 50 C 47 54 44 60 39 59 C 36 58 36 54 36 50 Z" opacity="0.95"/>
    <!-- Knuckle crease accents -->
    <path d="M 46 32 Q 50 33 54 32" stroke="#5ea80f" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 46 41 Q 50 42 54 41" stroke="#5ea80f" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
